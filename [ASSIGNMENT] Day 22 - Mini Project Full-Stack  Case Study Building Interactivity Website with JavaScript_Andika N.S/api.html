<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyStore - API Product</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <h2>MyStore</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="api.html">API Product</a>
        </nav>

        <div class="cart">
            Cart: <span id="cart-count">0</span>
        </div>

    </header>


    <main class="container">

        <h1>Product Detail - API</h1>


        <!-- LOADING -->
        <div id="loading" class="loading" hidden>

            <p>Sedang mengambil data produk...</p>

        </div>


        <!-- ERROR -->
        <div id="error-container" class="error-container" hidden>

            <h2>Terjadi Kesalahan!</h2>

            <p id="error-message"></p>

            <button
                type="button"
                id="retry-button"
                class="btn"
            >
                Coba Lagi
            </button>

        </div>


        <!-- PRODUCT SECTION -->
        <section
            id="product-section"
            class="product-container"
            hidden
        >

            <!-- GAMBAR PRODUK -->
            <div class="product-image">

                <img
                    id="product-image"
                    src=""
                    alt="Product"
                >

            </div>


            <!-- INFORMASI PRODUK -->
            <div class="product-info">

                <h2 id="product-name"></h2>

                <p id="product-description"></p>

                <h3 id="product-price"></h3>


                <!-- UKURAN -->
                <label for="variation">
                    Pilih Ukuran:
                </label>

                <select id="variation"></select>


                <!-- WARNA -->
                <label for="color">
                    Pilih Warna:
                </label>

                <select id="color"></select>


                <!-- JUMLAH -->
                <label for="quantity">
                    Jumlah Pembelian:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    step="1"
                >


                <!-- STOK -->
                <p>
                    Stok tersedia:
                    <span id="stock"></span>
                </p>


                <!-- SUBTOTAL -->
                <div class="summary">

                    <p>Subtotal:</p>

                    <h2 id="subtotal"></h2>

                </div>


                <!-- STATUS -->
                <p
                    id="status-message"
                    class="status"
                    aria-live="polite"
                ></p>


                <!-- ADD TO CART -->
                <button
                    type="button"
                    id="add-to-cart"
                    class="btn"
                >
                    Add to Cart
                </button>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/functions.js"></script>
    <script src="js/api.js"></script>

</body>

</html>
