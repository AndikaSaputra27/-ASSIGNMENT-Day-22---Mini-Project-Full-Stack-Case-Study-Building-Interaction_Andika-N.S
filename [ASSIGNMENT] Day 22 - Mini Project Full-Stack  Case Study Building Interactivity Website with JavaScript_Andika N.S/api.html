
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 22 - API Product</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <h2>MyStore</h2>

        <nav>
            <a href="index.html">Hardcoded Product</a>
            <a href="api.html">API Product</a>
        </nav>

        <div class="cart">
            Cart: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        <h1>Product Detail - API</h1>

        <div id="loading" class="loading">
            Loading product...
        </div>

        <div id="error-container" class="error-container" hidden>
            <p id="error-message"></p>

            <button id="retry-button" class="btn">
                Try Again
            </button>
        </div>

        <section id="product-section" class="product-container" hidden>

            <div class="product-image">
                <img id="product-image" src="" alt="Product">
            </div>

            <div class="product-info">
                <h2 id="product-name"></h2>

                <p id="product-description"></p>

                <h3 id="product-price"></h3>

                <label for="variation">Pilih Kategori:</label>
                <select id="variation"></select>

                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    step="1"
                >

                <p>
                    Stok tersedia:
                    <span id="stock"></span>
                </p>

                <div class="summary">
                    <p>Subtotal</p>
                    <h2 id="subtotal"></h2>
                </div>

                <p id="status-message" class="status"></p>

                <button id="add-to-cart" class="btn">
                    Add to Cart
                </button>
            </div>

        </section>
    </main>

    <script src="js/functions.js"></script>
    <script src="js/api.js"></script>

</body>
</html>
