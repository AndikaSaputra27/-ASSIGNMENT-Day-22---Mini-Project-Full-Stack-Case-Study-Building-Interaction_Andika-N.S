<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore - API Product</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <h2>MyStore</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="api.html">API Product</a>
            <span class="cart">Keranjang: <b id="cart-count">0</b></span>
        </nav>
    </header>

    <main class="container">
        <h1>Product dari API</h1>

        <div id="loading" class="message">
            Sedang mengambil data produk...
        </div>

        <div id="error-container" class="message error" hidden>
            <p id="error-message"></p>
            <button type="button" id="retry-button" class="primary-button">
                Coba Lagi
            </button>
        </div>

        <section id="product-section" class="product-card" hidden>
            <div class="product-image-area">
                <img id="product-image" src="" alt="Produk API">

                <div class="zoom-controls">
                    <button type="button" id="zoom-out">−</button>
                    <span id="zoom-level">100%</span>
                    <button type="button" id="zoom-in">+</button>
                    <button type="button" id="zoom-reset">Reset</button>
                </div>
            </div>

            <div class="product-info">
                <h2 id="product-name"></h2>
                <p id="product-description"></p>

                <h2 id="product-price" class="price"></h2>
                <p>Stok tersedia: <b id="stock"></b></p>

                <label for="color">Pilih Warna</label>
                <select id="color"></select>
                <div id="color-preview" class="color-preview"></div>

                <label for="variation">Pilih Ukuran</label>
                <select id="variation"></select>

                <label for="quantity">Jumlah Pembelian</label>
                <input type="number" id="quantity" min="1" value="1">

                <div class="subtotal-box">
                    <span>Subtotal</span>
                    <strong id="subtotal"></strong>
                </div>

                <p id="status-message" class="status"></p>

                <button type="button" id="add-to-cart" class="primary-button">
                    Tambahkan ke Keranjang
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 MyStore</p>
    </footer>

    <script src="js/functions.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
