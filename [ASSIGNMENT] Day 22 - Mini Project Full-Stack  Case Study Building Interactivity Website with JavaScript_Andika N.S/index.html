<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore - Classic T-Shirt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h2>MyStore</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="#komplain">Komplain</a>
        </nav>

        <div class="cart">
            Cart: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        <h1>Detail Produk</h1>

        <!-- PRODUK -->
        <section class="product-container">

            <div class="product-image">
                <img
                    id="product-image"
                    src=""
                    alt="Classic T-Shirt"
                >

                <div class="zoom-controls">
                    <button type="button" id="zoom-in">+</button>
                    <button type="button" id="zoom-out">−</button>
                    <button type="button" id="zoom-reset">Reset</button>
                </div>

                <p id="zoom-level">Zoom: 100%</p>
            </div>

            <div class="product-info">
                <h2 id="product-name"></h2>

                <p id="product-description"></p>

                <h3 id="product-price"></h3>

                <!-- PILIH UKURAN -->
                <label for="variation">Pilih Ukuran:</label>
                <select id="variation"></select>

                <!-- PILIH WARNA -->
                <label for="color">Pilih Warna:</label>
                <select id="color"></select>

                <!-- JUMLAH -->
                <label for="quantity">Jumlah Pembelian:</label>
                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    step="1"
                >

                <p class="stock-info">
                    Stok tersedia: <span id="stock"></span>
                </p>

                <!-- SUBTOTAL -->
                <div class="summary">
                    <p>Subtotal:</p>
                    <h2 id="subtotal"></h2>
                </div>

                <p id="status-message" class="status" aria-live="polite"></p>

                <button type="button" id="add-to-cart" class="btn">
                    Add to Cart
                </button>
            </div>
        </section>

        <!-- FORM KOMPLAIN -->
        <section class="complaint-section" id="komplain">
            <h2>Form Komplain Produk</h2>

            <p class="complaint-intro">
                Apabila warna atau ukuran produk yang diterima tidak sesuai
                dengan pesanan, silakan isi formulir komplain berikut.
            </p>

            <form id="complaint-form">

                <label for="complaint-name">Nama Pelanggan:</label>
                <input
                    type="text"
                    id="complaint-name"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <label for="order-number">Nomor Pesanan:</label>
                <input
                    type="text"
                    id="order-number"
                    placeholder="Contoh: ORD-001"
                    required
                >

                <label for="complaint-type">Jenis Komplain:</label>
                <select id="complaint-type" required>
                    <option value="">-- Pilih Komplain --</option>
                    <option value="Warna tidak sesuai">
                        Warna tidak sesuai
                    </option>
                    <option value="Ukuran tidak sesuai">
                        Ukuran tidak sesuai
                    </option>
                    <option value="Warna dan ukuran tidak sesuai">
                        Warna dan ukuran tidak sesuai
                    </option>
                    <option value="Produk lainnya">
                        Produk lainnya
                    </option>
                </select>

                <label for="received-color">Warna yang Diterima:</label>
                <select id="received-color" required>
                    <option value="">-- Pilih Warna --</option>
                    <option>Hitam</option>
                    <option>Putih</option>
                    <option>Khaky</option>
                    <option>Navy</option>
                    <option>Maroon</option>
                    <option>Pink</option>
                    <option>Sage Green</option>
                </select>

                <label for="expected-color">Warna yang Seharusnya:</label>
                <select id="expected-color" required>
                    <option value="">-- Pilih Warna --</option>
                    <option>Hitam</option>
                    <option>Putih</option>
                    <option>Khaky</option>
                    <option>Navy</option>
                    <option>Maroon</option>
                    <option>Pink</option>
                    <option>Sage Green</option>
                </select>

                <label for="received-size">Ukuran yang Diterima:</label>
                <select id="received-size" required>
                    <option value="">-- Pilih Ukuran --</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>XXL</option>
                    <option>3L</option>
                </select>

                <label for="expected-size">Ukuran yang Seharusnya:</label>
                <select id="expected-size" required>
                    <option value="">-- Pilih Ukuran --</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>XXL</option>
                    <option>3L</option>
                </select>

                <label for="complaint-detail">Detail Komplain:</label>
                <textarea
                    id="complaint-detail"
                    rows="5"
                    placeholder="Jelaskan masalah produk yang diterima..."
                    required
                ></textarea>

                <button type="submit" class="btn complaint-btn">
                    Kirim Komplain
                </button>

                <p
                    id="complaint-status"
                    class="status"
                    aria-live="polite"
                ></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MyStore. All Rights Reserved.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="js/products.js"></script>
    <script src="js/functions.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
